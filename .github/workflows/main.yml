name: Web E2E Tests

on: 

  workflow_dispatch:

 

jobs:

  e2e-tests:

    runs-on: ubuntu-latest

    steps: 
 

      # clone do projeto para a máquina
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executando os testes
        run: npx cypress run

 

      - uses: actions/upload-artifact@v4

        if: ${{ !cancelled() }}

        with:

          name: relatorios

          path: |

            cypress/reports

            cypress/screenshots

            cypress/videos
